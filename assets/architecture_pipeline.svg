<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="940" height="480" rx="16" fill="url(#bg2)" stroke="#1E293B" stroke-width="1.5" filter="url(#shadow2)"/>

  <!-- Top Header Bar -->
  <rect width="940" height="42" rx="16" fill="#0B1120"/>
  <rect y="30" width="940" height="12" fill="#0B1120"/>
  <line x1="0" y1="42" x2="940" y2="42" stroke="#1E293B" stroke-width="1"/>

  <circle cx="24" cy="21" r="6" fill="#EF4444" opacity="0.9"/>
  <circle cx="44" cy="21" r="6" fill="#F59E0B" opacity="0.9"/>
  <circle cx="64" cy="21" r="6" fill="#10B981" opacity="0.9"/>

  <text x="470" y="26" text-anchor="middle" class="mono" font-size="12" fill="#94A3B8" font-weight="600" letter-spacing="1">
    VYUH // FOUR-TIER HYBRID RISK ENGINE ARCHITECTURE (SUB-8ms CPU INFERENCE)
  </text>

  <!-- Step 0: Ingestion -->
  <g transform="translate(30, 60)">
    <rect width="180" height="150" rx="8" fill="url(#blueCard)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="#0284C7" fill-opacity="0.3"/>
    <text x="90" y="19" text-anchor="middle" class="sans" font-size="11" font-weight="800" fill="#38BDF8">INCOMING CHECKOUT</text>
    <text x="14" y="52" class="mono" font-size="10" fill="#E2E8F0">POST /api/score</text>
    <text x="14" y="70" class="mono" font-size="10" fill="#94A3B8">• orderId, amount</text>
    <text x="14" y="86" class="mono" font-size="10" fill="#94A3B8">• cardId (token)</text>
    <text x="14" y="102" class="mono" font-size="10" fill="#94A3B8">• deviceId (hash)</text>
    <text x="14" y="118" class="mono" font-size="10" fill="#94A3B8">• email, timestamp</text>
    <rect x="14" y="128" width="152" height="14" rx="4" fill="#0369A1" fill-opacity="0.5"/>
    <text x="90" y="139" text-anchor="middle" class="mono" font-size="9" fill="#E0F2FE">Node.js Express Gateway</text>
  </g>

  <!-- Arrows -->
  <path d="M 210 110 L 250 110" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
  <path d="M 210 160 L 250 160" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3"/>

  <!-- Step 1 & 2: Feature Engineering -->
  <g transform="translate(250, 60)">
    <!-- Tabular -->
    <rect width="210" height="85" rx="8" fill="url(#blueCard)" stroke="#6366F1" stroke-width="1.5"/>
    <text x="12" y="22" class="sans" font-size="11" font-weight="800" fill="#818CF8">TIER 1: TABULAR INTELLIGENCE</text>
    <text x="12" y="42" class="mono" font-size="10" fill="#CBD5E1">• 10 Isolated Behavioral Feats</text>
    <text x="12" y="58" class="mono" font-size="10" fill="#94A3B8">• Amount Z-Score, Diurnal Sin/Cos</text>
    <text x="12" y="74" class="mono" font-size="10" fill="#6EE7B7">Latency: ~0.08 ms (CPU)</text>

    <!-- Graph -->
    <g transform="translate(0, 100)">
      <rect width="210" height="105" rx="8" fill="url(#blueCard)" stroke="#EC4899" stroke-width="1.5"/>
      <text x="12" y="22" class="sans" font-size="11" font-weight="800" fill="#F472B6">TIER 2: TEMPORAL MULTIGRAPH</text>
      <text x="12" y="42" class="mono" font-size="10" fill="#CBD5E1">• In-Memory Bipartite NetworkX</text>
      <text x="12" y="58" class="mono" font-size="10" fill="#94A3B8">• 13 Feats: Device Card Rotation</text>
      <text x="12" y="74" class="mono" font-size="10" fill="#94A3B8">• Burst Velocity, 2-Hop Proximity</text>
      <text x="12" y="92" class="mono" font-size="10" fill="#6EE7B7">Traversal: 0.514 ms (CPU)</text>
    </g>
  </g>

  <!-- Merging Arrows -->
  <path d="M 460 102 L 500 135" stroke="#818CF8" stroke-width="2"/>
  <path d="M 460 212 L 500 175" stroke="#F472B6" stroke-width="2"/>

  <!-- Step 3 & 4: Joint GBDT & Guardrail -->
  <g transform="translate(500, 70)">
    <rect width="200" height="175" rx="8" fill="url(#blueCard)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="200" height="26" rx="8" fill="#047857" fill-opacity="0.4"/>
    <text x="100" y="18" text-anchor="middle" class="sans" font-size="11" font-weight="800" fill="#34D399">TIER 3: JOINT 23-FEAT GBDT</text>
    
    <text x="12" y="46" class="mono" font-size="10" fill="#CBD5E1">• Single Concatenated Space</text>
    <text x="12" y="62" class="mono" font-size="10" fill="#CBD5E1">• Captures Cross-Domain Splits</text>
    <text x="12" y="78" class="mono" font-size="10" fill="#94A3B8">• Isotonic Calibration Gate</text>
    <text x="12" y="94" class="mono" font-size="10" fill="#FBBF24">PR-AUC: 0.1456 (CANONICAL)</text>
    
    <!-- Tier 4 Floor -->
    <rect x="8" y="106" width="184" height="60" rx="6" fill="#1C1917" stroke="#EA580C" stroke-width="1"/>
    <text x="14" y="122" class="sans" font-size="10" font-weight="800" fill="#FB923C">TIER 4: SAFETY GUARDRAIL</text>
    <text x="14" y="138" class="mono" font-size="9" fill="#E2E8F0">2-Hop Known Fraud Floor (0.88)</text>
    <text x="14" y="152" class="mono" font-size="9" fill="#94A3B8">Deterministic Blacklist Floor</text>
  </g>

  <!-- Final Arrow -->
  <path d="M 700 157 L 740 157" stroke="#10B981" stroke-width="2"/>

  <!-- Step 5: Economic Decision Gateway -->
  <g transform="translate(740, 50)">
    <rect width="170" height="215" rx="8" fill="url(#blueCard)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="170" height="26" rx="8" fill="#B45309" fill-opacity="0.4"/>
    <text x="85" y="18" text-anchor="middle" class="sans" font-size="10" font-weight="800" fill="#FCD34D">ECONOMIC DECISION GATE</text>

    <!-- 3 Actions -->
    <g transform="translate(10, 36)">
      <rect width="150" height="48" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1"/>
      <text x="75" y="18" text-anchor="middle" class="sans" font-size="11" font-weight="800" fill="#34D399">ALLOW</text>
      <text x="75" y="32" text-anchor="middle" class="mono" font-size="9" fill="#A7F3D0">Risk &lt; 0.15</text>
      <text x="75" y="44" text-anchor="middle" class="mono" font-size="8" fill="#6EE7B7">1-Click Frictionless</text>
    </g>

    <g transform="translate(10, 92)">
      <rect width="150" height="48" rx="6" fill="#451A03" stroke="#D97706" stroke-width="1"/>
      <text x="75" y="18" text-anchor="middle" class="sans" font-size="11" font-weight="800" fill="#FBBF24">STEP-UP AUTH</text>
      <text x="75" y="32" text-anchor="middle" class="mono" font-size="9" fill="#FDE68A">0.15 ≤ Risk &lt; 0.25</text>
      <text x="75" y="44" text-anchor="middle" class="mono" font-size="8" fill="#FCD34D">2FA / OTP Challenge</text>
    </g>

    <g transform="translate(10, 148)">
      <rect width="150" height="54" rx="6" fill="#450A0A" stroke="#DC2626" stroke-width="1"/>
      <text x="75" y="18" text-anchor="middle" class="sans" font-size="11" font-weight="800" fill="#F87171">FLAG REVIEW</text>
      <text x="75" y="32" text-anchor="middle" class="mono" font-size="9" fill="#FECACA">Risk ≥ 0.25</text>
      <text x="75" y="46" text-anchor="middle" class="mono" font-size="8" fill="#FCA5A5">Forensic Brief Hold</text>
    </g>
  </g>

  <!-- Bottom Metric Banner -->
  <rect x="30" y="285" width="880" height="175" rx="10" fill="#0A0F1D" stroke="#1E293B" stroke-width="1"/>
  
  <text x="50" y="315" class="sans" font-size="14" font-weight="800" fill="#38BDF8">WHY THE 23-FEATURE JOINT GBDT WINS (MATHEMATICAL VERIFICATION):</text>
  
  <g transform="translate(50, 335)">
    <!-- Col 1 -->
    <rect width="260" height="105" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="14" y="26" class="sans" font-size="12" font-weight="700" fill="#34D399">+51.2% Fraud Capture Lift</text>
    <text x="14" y="46" class="mono" font-size="11" fill="#E2E8F0">Recall @ 1.0% Fixed FPR:</text>
    <text x="14" y="66" class="mono" font-size="14" font-weight="800" fill="#F8FAFC">7.60% ──► 11.49%</text>
    <text x="14" y="88" class="mono" font-size="10" fill="#94A3B8">Identical 1% merchant friction</text>
  </g>

  <g transform="translate(340, 335)">
    <!-- Col 2 -->
    <rect width="260" height="105" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="14" y="26" class="sans" font-size="12" font-weight="700" fill="#38BDF8">Strict Bootstrap 95% CI</text>
    <text x="14" y="46" class="mono" font-size="11" fill="#E2E8F0">300 Resamples on Test Split:</text>
    <text x="14" y="66" class="mono" font-size="14" font-weight="800" fill="#F8FAFC">[+0.0247, +0.0418]</text>
    <text x="14" y="88" class="mono" font-size="10" fill="#94A3B8">Strictly excludes zero (p &lt; 0.001)</text>
  </g>

  <g transform="translate(630, 335)">
    <!-- Col 3 -->
    <rect width="260" height="105" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="14" y="26" class="sans" font-size="12" font-weight="700" fill="#FBBF24">7.46 ms CPU P50 Latency</text>
    <text x="14" y="46" class="mono" font-size="11" fill="#E2E8F0">500 Microservice Inferences:</text>
    <text x="14" y="66" class="mono" font-size="14" font-weight="800" fill="#F8FAFC">P95: 8.38ms  │  P99: 13.5ms</text>
    <text x="14" y="88" class="mono" font-size="10" fill="#94A3B8">Zero GPU required · Commodity CPU</text>
  </g>
</svg>
