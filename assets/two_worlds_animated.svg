<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#03050A"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseA {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #10B981); }
    }
    @keyframes pulseB {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #EF4444); }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes barA {
      0% { width: 0px; }
      100% { width: 31px; }
    }
    @keyframes barB {
      0% { width: 0px; }
      100% { width: 192px; }
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .anim-cursor { animation: cursorBlink 0.9s infinite; }
    .anim-bar-a { animation: barA 1.2s ease-out forwards; }
    .anim-bar-b { animation: barB 1.2s ease-out forwards; }
  </style>

  <!-- Terminal Frame -->
  <rect width="920" height="490" rx="14" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- macOS Top Bar -->
  <rect width="920" height="38" rx="14" fill="#090E1A"/>
  <rect y="26" width="920" height="12" fill="#090E1A"/>
  <line x1="0" y1="38" x2="920" y2="38" stroke="#1E293B" stroke-width="1"/>

  <circle cx="22" cy="19" r="6" fill="#EF4444"/>
  <circle cx="42" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="62" cy="19" r="6" fill="#10B981"/>

  <!-- Terminal Command Prompt -->
  <text x="460" y="24" text-anchor="middle" class="mono" font-size="11" fill="#64748B" font-weight="600">
    bash — ./demo (Live GBDT Context Scoring)
  </text>

  <!-- Shell Command Bar -->
  <g transform="translate(30, 52)">
    <rect width="860" height="34" rx="6" fill="#0D1527" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="22" class="mono" font-size="12" fill="#10B981" font-weight="700">user@razorpay-node</text>
    <text x="162" y="22" class="mono" font-size="12" fill="#64748B">:~$</text>
    <text x="195" y="22" class="mono" font-size="12" fill="#F8FAFC" font-weight="700">./demo --two-worlds</text>
    <rect x="360" y="9" width="8" height="15" fill="#38BDF8" class="anim-cursor"/>
  </g>

  <!-- Hero Invariant Payload Header -->
  <g transform="translate(30, 96)">
    <rect width="860" height="66" rx="8" fill="#0A0F1D" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" class="sans" font-size="11" font-weight="800" fill="#94A3B8" letter-spacing="1">
      IDENTICAL TRANSACTION PAYLOAD (100% BITWISE INVARIANT ACROSS BOTH CONTEXTS):
    </text>
    <text x="20" y="48" class="mono" font-size="13" fill="#F8FAFC">
      Amount: <tspan fill="#34D399" font-weight="800">₹499.00</tspan>  │  Card: <tspan fill="#38BDF8">CARD_TITANIUM_88</tspan>  │  Device: <tspan fill="#CBD5E1">DEV_CHIP_99</tspan>  │  Time: <tspan fill="#F8FAFC">14:00 IST</tspan>
    </text>
  </g>

  <!-- World A Card (Clean) -->
  <g transform="translate(30, 172)">
    <rect width="420" height="240" rx="10" fill="#041A14" stroke="#059669" stroke-width="1.5" style="animation: pulseA 3s infinite;"/>
    <rect width="420" height="36" rx="10" fill="#064E3B" fill-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#10B981"/>
    <text x="34" y="22" class="sans" font-size="13" font-weight="800" fill="#34D399">WORLD A: CLEAN ISOLATED CONTEXT</text>

    <text x="20" y="58" class="sans" font-size="11" fill="#94A3B8">Relational Graph State:</text>
    <text x="20" y="76" class="sans" font-size="12" font-weight="700" fill="#E2E8F0">Dedicated Personal Hardware (1:1 Binding)</text>

    <!-- Metrics box -->
    <rect x="20" y="90" width="380" height="50" rx="6" fill="#022019" stroke="#047857" stroke-width="0.8"/>
    <text x="32" y="110" class="mono" font-size="10" fill="#6EE7B7">• Device 24h Unique Cards:  1 card (Isolated)</text>
    <text x="32" y="126" class="mono" font-size="10" fill="#6EE7B7">• Velocity Burst Rate:      1 txn / 60 mins</text>

    <!-- Risk Bar -->
    <text x="20" y="162" class="mono" font-size="10" fill="#64748B" font-weight="700">CALIBRATED GBDT RISK SCORE:</text>
    <rect x="20" y="172" width="290" height="14" rx="7" fill="#062E22"/>
    <rect x="20" y="172" width="31" height="14" rx="7" fill="#10B981" class="anim-bar-a"/>
    <text x="325" y="184" class="mono" font-size="16" font-weight="800" fill="#34D399">10.9%</text>

    <!-- Decision Banner -->
    <rect x="20" y="196" width="380" height="32" rx="6" fill="#047857"/>
    <text x="210" y="217" text-anchor="middle" class="sans" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="1">
      ✔ APPROVED (ALLOW) — 1-CLICK INSTANT
    </text>
  </g>

  <!-- World B Card (Syndicate) -->
  <g transform="translate(470, 172)">
    <rect width="420" height="240" rx="10" fill="#1F080B" stroke="#DC2626" stroke-width="1.5" style="animation: pulseB 3s infinite;"/>
    <rect width="420" height="36" rx="10" fill="#7F1D1D" fill-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <text x="34" y="22" class="sans" font-size="13" font-weight="800" fill="#F87171">WORLD B: COORDINATED SYNDICATE</text>

    <text x="20" y="58" class="sans" font-size="11" fill="#94A3B8">Relational Graph State:</text>
    <text x="20" y="76" class="sans" font-size="12" font-weight="700" fill="#FECACA">Same Hardware Cycled Across 10 Accounts in 30s</text>

    <!-- Metrics box -->
    <rect x="20" y="90" width="380" height="50" rx="6" fill="#2C0A0E" stroke="#B91C1C" stroke-width="0.8"/>
    <text x="32" y="110" class="mono" font-size="10" fill="#FCA5A5">• Device 24h Unique Cards:  8 cards (CRITICAL)</text>
    <text x="32" y="126" class="mono" font-size="10" fill="#FCA5A5">• Velocity Burst Rate:      10 txns in 30s (BOT)</text>

    <!-- Risk Bar -->
    <text x="20" y="162" class="mono" font-size="10" fill="#64748B" font-weight="700">CALIBRATED GBDT RISK SCORE:</text>
    <rect x="20" y="172" width="290" height="14" rx="7" fill="#3B1216"/>
    <rect x="20" y="172" width="192" height="14" rx="7" fill="#EF4444" class="anim-bar-b"/>
    <text x="325" y="184" class="mono" font-size="16" font-weight="800" fill="#F87171">68.5%</text>

    <!-- Decision Banner -->
    <rect x="20" y="196" width="380" height="32" rx="6" fill="#B91C1C"/>
    <text x="210" y="217" text-anchor="middle" class="sans" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="1">
      ⛔ FLAG HUMAN REVIEW — SETTLEMENT HELD
    </text>
  </g>

  <!-- Bottom Punchline -->
  <g transform="translate(30, 424)">
    <rect width="860" height="50" rx="8" fill="#0B1222" stroke="#1E293B" stroke-width="1"/>
    <text x="430" y="32" text-anchor="middle" class="sans" font-size="15" font-weight="800" fill="url(#cyanGlow)" letter-spacing="1">
      "THE TRANSACTION DIDN'T CHANGE. THE CONTEXT DID."
    </text>
  </g>
</svg>
