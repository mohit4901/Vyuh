<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="winnerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="940" height="380" rx="16" fill="url(#bg3)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Chrome -->
  <rect width="940" height="40" rx="16" fill="#0B1120"/>
  <rect y="28" width="940" height="12" fill="#0B1120"/>
  <line x1="0" y1="40" x2="940" y2="40" stroke="#1E293B" stroke-width="1"/>

  <circle cx="24" cy="20" r="5" fill="#EF4444"/>
  <circle cx="42" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="20" r="5" fill="#10B981"/>

  <text x="470" y="25" text-anchor="middle" class="mono" font-size="12" fill="#94A3B8" font-weight="600" letter-spacing="1">
    EXECUTIVE BENCHMARK SCORECARD · 118,108 HELD-OUT TRANSACTIONS (3.44% FRAUD)
  </text>

  <!-- Table Headers -->
  <g transform="translate(30, 60)">
    <rect width="880" height="36" rx="6" fill="#1E293B"/>
    <text x="20" y="23" class="sans" font-size="11" font-weight="800" fill="#94A3B8">EVALUATION DIMENSION</text>
    <text x="290" y="23" class="sans" font-size="11" font-weight="800" fill="#94A3B8">M0: CONVENTIONAL RULES</text>
    <text x="510" y="23" class="sans" font-size="11" font-weight="800" fill="#94A3B8">M1: TABULAR BASELINE</text>
    <text x="730" y="23" class="sans" font-size="11" font-weight="800" fill="#34D399">M3: VYUH JOINT GBDT</text>
  </g>

  <!-- Row 1: PR-AUC -->
  <g transform="translate(30, 106)">
    <rect width="880" height="46" rx="6" fill="#0B1324"/>
    <text x="20" y="28" class="sans" font-size="12" font-weight="700" fill="#E2E8F0">Precision-Recall AUC (PR-AUC)</text>
    <text x="290" y="28" class="mono" font-size="13" fill="#EF4444">0.0395 (Near Random)</text>
    <text x="510" y="28" class="mono" font-size="13" fill="#FBBF24">0.1124 (10 Feats)</text>
    <rect x="710" y="8" width="160" height="30" rx="4" fill="#047857" fill-opacity="0.5" stroke="#10B981" stroke-width="1"/>
    <text x="790" y="28" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#34D399">0.1456 (+29.6%)</text>
  </g>

  <!-- Row 2: Recall @ 1% FPR -->
  <g transform="translate(30, 160)">
    <rect width="880" height="46" rx="6" fill="#0E172A"/>
    <text x="20" y="28" class="sans" font-size="12" font-weight="700" fill="#E2E8F0">Fraud Recall @ 1.0% Fixed FPR</text>
    <text x="290" y="28" class="mono" font-size="13" fill="#94A3B8">0.0% (Rules Fails Budget)</text>
    <text x="510" y="28" class="mono" font-size="13" fill="#CBD5E1">7.60% caught</text>
    <rect x="710" y="8" width="160" height="30" rx="4" fill="#047857" fill-opacity="0.5" stroke="#10B981" stroke-width="1"/>
    <text x="790" y="28" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#34D399">11.49% (+51.2%)</text>
  </g>

  <!-- Row 3: Recall @ 0.5% FPR -->
  <g transform="translate(30, 214)">
    <rect width="880" height="46" rx="6" fill="#0B1324"/>
    <text x="20" y="28" class="sans" font-size="12" font-weight="700" fill="#E2E8F0">Fraud Recall @ 0.5% Fixed FPR</text>
    <text x="290" y="28" class="mono" font-size="13" fill="#94A3B8">0.0% (Rules Fails Budget)</text>
    <text x="510" y="28" class="mono" font-size="13" fill="#CBD5E1">3.94% caught</text>
    <rect x="710" y="8" width="160" height="30" rx="4" fill="#047857" fill-opacity="0.5" stroke="#10B981" stroke-width="1"/>
    <text x="790" y="28" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#34D399">7.31% (+85.5%)</text>
  </g>

  <!-- Row 4: False Positive Rate @ 20% Recall -->
  <g transform="translate(30, 268)">
    <rect width="880" height="46" rx="6" fill="#0E172A"/>
    <text x="20" y="28" class="sans" font-size="12" font-weight="700" fill="#E2E8F0">FPR @ 20% Fixed Fraud Recall</text>
    <text x="290" y="28" class="mono" font-size="13" fill="#EF4444">28.03% (Massive Friction)</text>
    <text x="510" y="28" class="mono" font-size="13" fill="#FBBF24">3.35% false alarms</text>
    <rect x="710" y="8" width="160" height="30" rx="4" fill="#047857" fill-opacity="0.5" stroke="#10B981" stroke-width="1"/>
    <text x="790" y="28" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#34D399">2.48% (-26.0%)</text>
  </g>

  <!-- Row 5: Inference Latency -->
  <g transform="translate(30, 322)">
    <rect width="880" height="46" rx="6" fill="#0B1324"/>
    <text x="20" y="28" class="sans" font-size="12" font-weight="700" fill="#E2E8F0">Total Latency (P50 CPU)</text>
    <text x="290" y="28" class="mono" font-size="13" fill="#34D399">&lt; 0.01 ms (Blind rules)</text>
    <text x="510" y="28" class="mono" font-size="13" fill="#34D399">&lt; 0.01 ms (No graph)</text>
    <rect x="710" y="8" width="160" height="30" rx="4" fill="#0369A1" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1"/>
    <text x="790" y="28" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#38BDF8">7.46 ms (Sub-8ms SLA)</text>
  </g>
</svg>
